<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styled Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
        }

        form {
            width: 460px;
            padding: 32px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #4a90e2;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
        }

        .brand-text {
            font-size: 20px;
            font-weight: bold;
            color: #1f2a37;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 15px;
            color: #334155;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 14px;
            border: 1px solid #ccd5e0;
            border-radius: 8px;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        input[type="submit"] {
            padding: 14px 14px;
            border: none;
            border-radius: 8px;
            background: #4a90e2;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        input[type="submit"]:hover {
            background: #3a78bf;
        }

        .logo-row {
            margin-top: 6px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .mini-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid #d3dce7;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #4b5563;
            background: #f8fafc;
        }
    </style>
</head>
<body>
<form action="postform.php" method="POST" >
    <div class="brand">
        <div class="brand-logo">ITP</div>
        <div class="brand-text">User Login</div>
    </div>

    <div class="field">
        <label for="name">Email</label>
        <input id="name" type="email" name="name" placeholder="Enter your Email">
    </div>

    <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Enter your password">
    </div>

    <input type="submit" value="Submit">

    <div class="logo-row" aria-hidden="true">
        <div class="mini-logo">FB</div>
        <div class="mini-logo">IG</div>
        <div class="mini-logo">X</div>
    </div>
</form>
</body>
</html>
